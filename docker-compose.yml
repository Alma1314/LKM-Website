services:
  nginx:
    image: nginx:1.27-alpine
    entrypoint: ['sh', '/entrypoint.sh']
    command: ['nginx', '-g', 'daemon off;']
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./LKM-official-website/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./LKM-official-website/nginx/proxy-common-headers.conf:/etc/nginx/proxy-common-headers.conf:ro
      - ./LKM-official-website/nginx/entrypoint.sh:/entrypoint.sh:ro
      - certbot_conf:/etc/letsencrypt
      - certbot_www:/var/www/certbot:ro
    restart: unless-stopped
    depends_on:
      astro:
        condition: service_healthy
      backend:
        condition: service_healthy
    networks:
      - lkm

  certbot:
    image: certbot/certbot
    entrypoint: ['sh', '/certbot-entrypoint.sh']
    volumes:
      - ./LKM-official-website/nginx/certbot-entrypoint.sh:/certbot-entrypoint.sh:ro
      - certbot_conf:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    restart: unless-stopped
    depends_on:
      - nginx
    networks:
      - lkm

  astro:
    build:
      context: ./LKM-official-website
      dockerfile: Dockerfile
      target: runner
    image: lkm-official-website:latest
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 4321
      # SSR 数据获取直连后端(compose 内网别名);浏览器端 /api、/graphql 由 nginx 直接反代
      API_URL: http://backend:8000
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:4321/robots.txt']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
    networks:
      - lkm

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lkm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?生产需设置 POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-lkm}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - lkm

  redis:
    image: redis:7-alpine
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - lkm

  backend:
    build:
      context: ./LKM-service
      dockerfile: Dockerfile
    image: lkm-service:latest
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      LKM_ENV: production
      LKM_DB_DRIVER: postgresql
      LKM_DB_HOST: postgres
      LKM_DB_PORT: 5432
      LKM_DB_NAME: ${POSTGRES_DB:-lkm}
      LKM_DB_USER: ${POSTGRES_USER:-lkm}
      LKM_DB_PASSWORD: ${POSTGRES_PASSWORD:?生产需设置 POSTGRES_PASSWORD}
      LKM_REDIS_URL: redis://redis:6379/0
      # 多 worker：按压测基线调，默认单 worker；多核下水平跑满 CPU
      LKM_WEB_WORKERS: ${LKM_WEB_WORKERS:-1}
      LKM_BLOG_REPO_DIR: /data/blog_repos
      LKM_FILES_STORE_DIR: /data/files_store
      LKM_JWT_SECRET: ${LKM_JWT_SECRET:?生产需设置 LKM_JWT_SECRET}
      LKM_TOTP_ENCRYPTION_KEY: ${LKM_TOTP_ENCRYPTION_KEY:?生产需设置 LKM_TOTP_ENCRYPTION_KEY}
      LKM_VERIFICATION_CODE_PEPPER: ${LKM_VERIFICATION_CODE_PEPPER:?生产需设置 LKM_VERIFICATION_CODE_PEPPER}
      LKM_GITHUB_CLIENT_ID: ${LKM_GITHUB_CLIENT_ID:-}
      LKM_GITHUB_CLIENT_SECRET: ${LKM_GITHUB_CLIENT_SECRET:-}
      LKM_RP_ID: lkm.s12mc.xyz
      LKM_ORIGIN: https://lkm.s12mc.xyz
      LKM_GITHUB_REDIRECT_URI: https://lkm.s12mc.xyz/api/v1/auth/oauth/github/callback
      LKM_FRONTEND_CALLBACK: https://lkm.s12mc.xyz/login/success
    volumes:
      - backend_data:/data
    restart: unless-stopped
    healthcheck:
      test:
        [
          'CMD',
          'python',
          '-c',
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=5)",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - lkm

  worker-send:
    image: lkm-service:latest
    command: ['python', '-m', 'app.core.worker_send']
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      LKM_ENV: production
      LKM_REDIS_URL: redis://redis:6379/0
      LKM_DB_DRIVER: postgresql
      LKM_DB_HOST: postgres
      LKM_DB_PORT: 5432
      LKM_DB_NAME: ${POSTGRES_DB:-lkm}
      LKM_DB_USER: ${POSTGRES_USER:-lkm}
      LKM_DB_PASSWORD: ${POSTGRES_PASSWORD:?生产需设置 POSTGRES_PASSWORD}
    restart: unless-stopped
    networks:
      - lkm

  worker:
    image: lkm-service:latest
    command: ['python', '-m', 'app.core.worker_default']
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      LKM_ENV: production
      LKM_REDIS_URL: redis://redis:6379/0
      LKM_DB_DRIVER: postgresql
      LKM_DB_HOST: postgres
      LKM_DB_PORT: 5432
      LKM_DB_NAME: ${POSTGRES_DB:-lkm}
      LKM_DB_USER: ${POSTGRES_USER:-lkm}
      LKM_DB_PASSWORD: ${POSTGRES_PASSWORD:?生产需设置 POSTGRES_PASSWORD}
    restart: unless-stopped
    networks:
      - lkm

volumes:
  certbot_conf:
  certbot_www:
  backend_data:
  postgres_data:
  redis_data:

networks:
  lkm:
    driver: bridge
